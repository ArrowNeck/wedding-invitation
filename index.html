<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kushan &amp; Ishara — Wedding Invitation</title>
    <meta
      name="description"
      content="You are warmly invited to celebrate the wedding of Kushan Geeth and Ishara Dissanayaka on 26 November 2026."
    />
    <meta name="theme-color" content="#5A0D1D" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Kushan & Ishara — Wedding Invitation" />
    <meta
      property="og:description"
      content="Thursday, 26 November 2026 · Hotel Savaanaa, Keppetipola"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Noto+Serif+Sinhala:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        --dk: #4a0a18;
        --g1: #f6d68a;
        --g2: #e3b04b;
        --g3: #b8862e;
        --bgc: radial-gradient(
          120% 80% at 50% 22%,
          #fffdf5,
          #fbebcb 58%,
          #efd39a
        );
        --bgd: #e9d2a0;
        --tx: #4a0a18;
        --ac: #8a1d30;
        --gt: linear-gradient(
          100deg,
          #6b3e0a,
          #a8741a 30%,
          #d9a93a 48%,
          #8a5a12 62%,
          #6b3e0a
        );
        --pn: rgba(255, 250, 238, 0.9);
        --ln: #fff8ea;
        --dA: #fcefd0;
        --dB: #f3d9a2;
        --h1: rgba(138, 29, 48, 0.1);
        --h2: rgba(138, 29, 48, 0.14);
        --h3: rgba(15, 107, 92, 0.16);
        --ray: rgba(184, 134, 46, 0.13);
        --cp: #7c1a2b;
        --cp2: #a33047;
        --lo: 0.85;
        --sh: rgba(90, 50, 20, 0.4);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --dk: #3a0912;
        --bgc: radial-gradient(
          120% 80% at 50% 25%,
          #8a1d30,
          #5a0d1d 55%,
          #33070f
        );
        --bgd: #2a060e;
        --tx: #fff1d6;
        --ac: #f6d68a;
        --gt: linear-gradient(
          100deg,
          #b8862e,
          #f6d68a 30%,
          #fff3c4 48%,
          #e3b04b 62%,
          #b8862e
        );
        --pn: rgba(58, 9, 18, 0.74);
        --ln: #3a0912;
        --dA: #6a1022;
        --dB: #8a1d30;
        --h1: rgba(20, 2, 8, 0.35);
        --h2: rgba(20, 2, 8, 0.42);
        --h3: rgba(15, 107, 92, 0.32);
        --ray: rgba(246, 214, 138, 0.1);
        --cp: #2b0710;
        --cp2: #4a0f1f;
        --lo: 0.55;
        --sh: rgba(0, 0, 0, 0.55);
      }
      :root {
        --cd: "Cinzel Decorative", "Cinzel", Georgia, serif;
        --cz: "Cinzel", Georgia, serif;
        --cg: "Cormorant Garamond", Georgia, serif;
        --si: "Noto Serif Sinhala", "Iskoola Pota", serif;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bgd);
        color: var(--tx);
        font: 600 1.15rem/1.5 var(--cg);
        -webkit-tap-highlight-color: transparent;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
        font-weight: inherit;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        display: block;
      }
      #app {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 50%;
        width: min(100vw, 480px);
        transform: translateX(-50%);
        overflow: hidden;
        background: var(--bgc);
        box-shadow: 0 0 70px rgba(60, 30, 10, 0.45);
      }
      .rays {
        position: absolute;
        left: -60%;
        top: -60%;
        width: 220%;
        height: 220%;
        z-index: 0;
        pointer-events: none;
        background: repeating-conic-gradient(
          from 0deg at 50% 30%,
          var(--ray) 0 5deg,
          transparent 5deg 16deg
        );
        -webkit-mask: radial-gradient(circle at 50% 30%, #000, transparent 55%);
        mask: radial-gradient(circle at 50% 30%, #000, transparent 55%);
        animation: rot 120s linear infinite;
      }
      @keyframes rot {
        to {
          transform: rotate(360deg);
        }
      }
      .lat {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: var(--lo);
        background: var(--lat) center/60px 60px;
      }
      #hills {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 26%;
        z-index: 0;
      }
      .fr {
        position: absolute;
        inset: 12px;
        z-index: 1;
        pointer-events: none;
        border: 2px solid var(--g2);
        border-radius: 14px;
        box-shadow:
          inset 0 0 0 5px var(--ln),
          inset 0 0 0 6px var(--g3),
          0 0 24px var(--sh);
      }
      .bd {
        position: absolute;
        left: 24px;
        right: 24px;
        height: 26px;
        z-index: 1;
        pointer-events: none;
        background: var(--liya) repeat-x center/80px 26px;
      }
      .bd.t {
        top: 22px;
      }
      .bd.b {
        bottom: 22px;
        transform: scaleY(-1);
      }
      .ro {
        position: absolute;
        z-index: 2;
        width: 46px;
        height: 46px;
        pointer-events: none;
      }
      .ro.a {
        top: 5px;
        left: 5px;
      }
      .ro.b {
        top: 5px;
        right: 5px;
      }
      .ro.c {
        bottom: 5px;
        left: 5px;
      }
      .ro.d {
        bottom: 5px;
        right: 5px;
      }
      .gt {
        background: var(--gt);
        background-size: 260% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 5.5s linear infinite;
        filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
      }
      @keyframes sh {
        to {
          background-position: -260% 0;
        }
      }
      .pg {
        position: absolute;
        inset: 0;
        z-index: 2;
        padding: 12svh 12% 15svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        filter: blur(8px);
        transform: scale(1.04);
        transition:
          opacity 0.9s,
          filter 0.9s,
          transform 0.9s,
          visibility 0s 0.9s;
      }
      .pg.on {
        opacity: 1;
        visibility: visible;
        filter: none;
        transform: none;
        transition:
          opacity 0.9s 0.2s,
          filter 0.9s 0.2s,
          transform 0.9s 0.2s,
          visibility 0s;
      }
      .a {
        opacity: 0;
      }
      .pg.on .a,
      .pg.out .a {
        opacity: 1;
      }
      .pg.on .a {
        animation: fu 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) var(--d, 0s) both;
      }
      @keyframes fu {
        from {
          opacity: 0;
          transform: translateY(18px);
          filter: blur(5px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      .lab {
        font: 700 0.78rem var(--cz);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ac);
      }
      .gn {
        font: 900 clamp(1.25rem, 6vw, 1.75rem)/1.25 var(--cd);
        margin: 0.3rem 0 0.2rem;
      }
      .top {
        justify-content: flex-start;
        padding-top: 13svh;
      }
      .big {
        font: 900 clamp(1.7rem, 7.5vw, 2.2rem)/1.15 var(--cd);
      }
      .nm {
        font: 900 clamp(2.3rem, 11.5vw, 3.3rem)/1.05 var(--cd);
        letter-spacing: 0.04em;
      }
      .am {
        font: italic 600 1.7rem var(--cg);
        color: var(--ac);
        margin: 0.1rem 0;
      }
      .txt {
        font: 600 1.22rem/1.5 var(--cg);
        color: var(--tx);
        max-width: 300px;
        margin: 0.9rem 0 1.1rem;
      }
      .sn {
        font: 700 1.5rem var(--si);
        color: var(--ac);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.6rem 1.35rem;
        border-radius: 99px;
        cursor: pointer;
        text-decoration: none;
        font: 700 0.8rem var(--cz);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dk);
        background: linear-gradient(#f9e3a5, #e3b04b 55%, #b8862e);
        border: 1px solid #ffe9a8;
        box-shadow:
          0 3px 10px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }
      .pill.o {
        background: var(--pn);
        color: var(--ac);
        border: 1.5px solid var(--g2);
      }
      .pill:hover,
      .pill:focus-visible {
        filter: brightness(1.1);
      }
      .row {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .lotus {
        width: min(50vw, 23svh * 1.25);
        overflow: visible;
        margin: 0.2rem auto;
      }
      .pg .lotus .pt {
        transform: scale(0);
        transform-origin: 0 0;
      }
      .pg.on .lotus .pt {
        animation: bl 1.5s cubic-bezier(0.2, 0.9, 0.2, 1)
          calc(0.3s + var(--i) * 0.1s) forwards;
      }
      @keyframes bl {
        to {
          transform: scale(1);
        }
      }
      .orn {
        width: 120px;
        margin: 0.7rem auto 0;
        color: var(--g2);
      }
      .fm {
        display: grid;
        grid-template-columns: 1fr 1px 1fr;
        gap: 0.6rem;
        align-items: center;
        margin-top: 1rem;
        width: 100%;
        max-width: 330px;
      }
      .fm i {
        height: 52px;
        background: var(--g3);
      }
      .fm b {
        display: block;
        font: 700 0.92rem var(--cz);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--ac);
      }
      .fm span {
        font: 600 0.78rem var(--cz);
        letter-spacing: 0.3em;
        color: var(--tx);
        text-transform: uppercase;
      }
      .mn {
        position: relative;
        width: min(78vw, 36svh);
        aspect-ratio: 1;
        margin: 0.9rem 0 1.1rem;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
      }
      .mn svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .mn .r2 {
        animation: rot 70s linear infinite;
      }
      .mn .r3 {
        animation: rot 90s linear infinite reverse;
      }
      .mn .r1 {
        animation: rot 140s linear infinite;
      }
      .mc {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .mc .d {
        font: 900 clamp(2.8rem, 10svh, 3.7rem)/1 var(--cd);
        background-image: linear-gradient(
          100deg,
          #b8862e,
          #f6d68a 30%,
          #fff3c4 48%,
          #e3b04b 62%,
          #b8862e
        );
        filter: none;
      }
      .mc .mo {
        font: 700 0.7rem var(--cz);
        letter-spacing: 0.2em;
        color: #fff1d6;
      }
      .mc .y {
        font: 700 0.85rem var(--cz);
        letter-spacing: 0.25em;
        color: #f6d68a;
      }
      .mf {
        width: min(70vw, 29svh * 1.2);
        aspect-ratio: 1/1.1;
        margin: 0.9rem 0;
        border-radius: 999px 999px 12px 12px;
        border: 3px solid var(--g2);
        padding: 6px;
        background: var(--ln);
        box-shadow:
          0 0 0 3px var(--ln),
          0 0 0 4px var(--g3),
          0 10px 26px var(--sh);
      }
      .mf iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 999px 999px 6px 6px;
        filter: sepia(0.5) saturate(0.9) hue-rotate(-15deg) brightness(0.95);
      }
      .vn {
        margin: 0.1rem 0 0.8rem;
        line-height: 1.3;
        color: var(--tx);
      }
      .vn b {
        font: 700 1.05rem var(--cz);
        letter-spacing: 0.1em;
        color: var(--ac);
        text-transform: uppercase;
      }
      .cdn {
        font: 900 clamp(4rem, 13svh, 5.4rem)/1 var(--cd);
      }
      .cdl {
        font: 700 0.8rem var(--cz);
        letter-spacing: 0.4em;
        color: var(--tx);
      }
      .cdr {
        display: flex;
        gap: 0.7rem;
        justify-content: center;
        margin-top: 1.1rem;
      }
      .tile {
        min-width: 76px;
        padding: 0.6rem 0.4rem 0.5rem;
        border: 1.5px solid var(--g2);
        border-radius: 40px 40px 6px 6px;
        background: var(--pn);
      }
      .tile b {
        display: block;
        font: 900 1.7rem/1 var(--cd);
        color: var(--ac);
      }
      .tile span {
        font: 700 0.62rem var(--cz);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--tx);
      }
      .lp {
        width: 46px;
        height: 92px;
        flex: none;
      }
      .fm_ {
        transform-origin: 30px 60px;
        animation: fk 1.3s ease-in-out infinite alternate;
      }
      @keyframes fk {
        0% {
          transform: scale(1, 1) rotate(-2deg);
        }
        50% {
          transform: scale(0.93, 1.08) rotate(2deg);
        }
        100% {
          transform: scale(1.04, 0.96) rotate(-1deg);
        }
      }
      .gl {
        transform-origin: 30px 44px;
        animation: gw 2.2s ease-in-out infinite alternate;
      }
      @keyframes gw {
        from {
          opacity: 0.55;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      .nx {
        position: absolute;
        z-index: 30;
        left: 50%;
        bottom: max(4.4svh, calc(env(safe-area-inset-bottom, 0px) + 14px));
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .nx svg {
        animation: bn 2.2s ease-in-out infinite;
      }
      @keyframes bn {
        50% {
          transform: translateY(4px);
        }
      }
      .fab {
        position: absolute;
        z-index: 40;
        right: 16px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: grid;
        place-items: center;
        color: var(--ac);
        background: var(--pn);
        border: 1.5px solid var(--g2);
        box-shadow: 0 3px 10px var(--sh);
        font: 1.15rem var(--cg);
      }
      #mus {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      }
      #auto {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 66px);
      }
      #mus:before {
        content: "♪";
      }
      #mus[aria-pressed="false"]:after {
        content: "";
        position: absolute;
        width: 26px;
        height: 2px;
        background: var(--g1);
        border-radius: 2px;
        transform: rotate(-45deg);
      }
      #mus[aria-pressed="true"] {
        animation: pu 2s ease-out infinite;
      }
      @keyframes pu {
        0% {
          box-shadow: 0 0 0 0 rgba(246, 214, 138, 0.55);
        }
        100% {
          box-shadow: 0 0 0 16px rgba(246, 214, 138, 0);
        }
      }
      #auto:before {
        content: "▶";
        font-size: 0.8rem;
      }
      #auto[aria-pressed="true"]:before {
        content: "❚❚";
        font-size: 0.6rem;
      }
      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 20;
        pointer-events: none;
      }
      #fl {
        position: absolute;
        inset: 0;
        z-index: 25;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          circle at 50% 45%,
          rgba(255, 226, 150, 0.5),
          transparent 62%
        );
      }
      #fl.go {
        animation: fz 1.1s;
      }
      @keyframes fz {
        0% {
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      /* cover */
      #cover {
        position: absolute;
        inset: 0;
        z-index: 60;
        transition: visibility 0s 2s;
      }
      #cover.open {
        visibility: hidden;
        pointer-events: none;
      }
      .flare {
        position: absolute;
        left: 50%;
        top: 48%;
        width: 150%;
        aspect-ratio: 1;
        margin: -75% 0 0 -75%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fff3c4,
          rgba(233, 138, 21, 0.65) 30%,
          transparent 62%
        );
        opacity: 0;
        scale: 0.1;
      }
      #cover.open .flare {
        animation: fr 2s ease-out;
      }
      @keyframes fr {
        0% {
          opacity: 0;
          scale: 0.1;
        }
        30% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          scale: 1;
        }
      }
      .dr {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50.4%;
        overflow: hidden;
        background: linear-gradient(90deg, var(--dA), var(--dB));
        transition: transform 1.8s cubic-bezier(0.7, 0, 0.2, 1);
      }
      .dr:before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--lat) center/60px 60px;
        opacity: 0.7;
      }
      .dr:after {
        content: "";
        position: absolute;
        inset: 22px 14px;
        border: 2px solid var(--g2);
        box-shadow:
          inset 0 0 0 5px var(--ln),
          inset 0 0 0 6px var(--g3);
      }
      .d1 {
        left: 0;
        box-shadow: 8px 0 20px var(--sh);
      }
      .d2 {
        right: 0;
        box-shadow: -8px 0 20px var(--sh);
      }
      .cpa {
        position: relative;
        display: block;
        aspect-ratio: 3/4;
      }
      .cpa i {
        position: absolute;
        inset: 0;
        border-radius: 999px 999px 14px 14px;
        background: radial-gradient(
          circle at 50% 38%,
          #ffe9b0,
          #f2b955 58%,
          #d98a2b
        );
        border: 3px solid var(--g3);
        box-shadow:
          inset 0 0 0 3px #fff3c4,
          0 0 0 3px var(--ln),
          0 0 0 4px var(--g3),
          0 10px 24px var(--sh);
      }
      .cpa img {
        position: absolute;
        left: 50%;
        bottom: 3%;
        height: 84%;
        width: auto;
        transform: translateX(-50%);
        filter: drop-shadow(0 4px 6px rgba(70, 30, 10, 0.3));
      }
      .dr .cpa {
        position: absolute;
        bottom: 25%;
        height: 48%;
        z-index: 1;
      }
      .d1 .cpa {
        left: 100%;
        transform: translateX(-50%);
      }
      .d2 .cpa {
        left: 0;
        transform: translateX(-50%);
      }
      .dr .ph {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 198.4%;
        z-index: 0;
        background: var(--pu) var(--pp, center 30%) / cover no-repeat;
      }
      .d1 .ph {
        left: 0;
      }
      .d2 .ph {
        right: 0;
      }
      .dr .ph:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          rgba(252, 239, 208, 0.3),
          rgba(252, 239, 208, 0.04) 40%,
          rgba(252, 239, 208, 0.4)
        );
      }
      #cp {
        position: absolute;
        z-index: 1;
        left: 50%;
        bottom: 11svh;
        height: var(--ch, 50svh);
        aspect-ratio: 3/4;
        transform: translateX(-50%);
        opacity: var(--co, 0.1);
        transition:
          opacity 1.2s,
          height 1.2s;
        pointer-events: none;
      }
      #cp .cpa {
        width: 100%;
        height: 100%;
      }
      #cover.open .d1 {
        transform: translateX(-101%);
      }
      #cover.open .d2 {
        transform: translateX(101%);
      }
      .sl {
        position: absolute;
        left: 50%;
        top: 74%;
        width: 104px;
        height: 104px;
        margin: -52px 0 0 -52px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        cursor: pointer;
        border: 0;
        color: #f6d68a;
        background: conic-gradient(
          from 0deg,
          #b8862e,
          #f6d68a,
          #b8862e,
          #fff3c4,
          #b8862e
        );
        box-shadow:
          0 0 30px rgba(246, 214, 138, 0.6),
          0 8px 18px rgba(0, 0, 0, 0.6);
        animation: ps 3s ease-in-out infinite;
        transition:
          opacity 0.5s,

    <script>

      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s).replace(

              ({
                "&": "&amp;",

              })[m],

      /* guest name: ?to=Mr._Thushan_Karunathilaka (underscores, + or %20 all become spaces; use links.html to generate links) */
      const Q = new URLSearchParams(location.search),
        guest = (Q.get("to") || Q.get("name") || Q.get("guest") || "")
          .replace(/[_+]/g, " ")
          .replace(/[^\p{L}\p{M}\s.'&-]/gu, "")
          .replace(/\s+/g, " ")

          .slice(0, 60);
      document.documentElement.dataset.theme = W.theme;
      const dt = new Date(W.iso),
        RM = matchMedia("(prefers-reduced-motion:reduce)").matches,
        gf = W.groom.name.split(" ")[0],
        bf = W.bride.name.split(" ")[0],
        mq = encodeURIComponent(W.venue.mapQuery);
      /* ===== Sri Lankan motifs (own SVG artwork) ===== */
      const uri = (s) => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
      document.documentElement.style.setProperty(
        "--liya",
        uri(
          '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="26" viewBox="0 0 80 26" fill="none" stroke="#E3B04B" stroke-width="1.6"><path d="M0 13C10 1 30 1 40 13S70 25 80 13"/><circle cx="20" cy="6" r="2.4" fill="#E3B04B" stroke="none"/><circle cx="60" cy="20" r="2.4" fill="#E3B04B" stroke="none"/><path d="M40 13q5-9 14-8q-4 8-14 8zM0 13q5 9 14 8q-4-8-14-8z" fill="#B8862E" stroke="none"/></svg>',
        ),

      document.documentElement.style.setProperty(

        uri(
          '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#E3B04B" stroke-width="1" opacity=".22"><path d="M30 2L58 30L30 58L2 30z"/><circle cx="30" cy="30" r="9"/><path d="M30 21q6 9 0 18q-6-9 0-18zM21 30q9-6 18 0q-9 6-18 0z"/></svg>',

      const lotus = () => {
        let s =
            '<svg class="lotus" viewBox="-85 -75 170 125" aria-hidden="true">',

        [
          [9, 1, -86, 86],

            s += `<g transform="translate(0 44) rotate(${a.toFixed(1)}) scale(${k})"><path class="pt" style="--i:${i++}" d="M0 0C-15 -20 -13 -50 0 -70C13 -50 15 -20 0 0Z" fill="url(#gg)" stroke="#7A4E10" stroke-width=".9"/></g>`;
          }

          s +
          '<circle cx="0" cy="40" r="7" fill="#B8862E"/><path d="M0 22v-14" stroke="#7A4E10"/></svg>'

      };
      const lamp = (c) =>
        `<svg class="${c}" viewBox="0 0 60 120" aria-hidden="true"><circle class="gl" cx="30" cy="44" r="22" fill="#FFB93B" opacity=".35"/><g class="fm_"><path d="M30 62C19 47 27 35 30 20C33 35 41 47 30 62z" fill="url(#fg)"/></g><path d="M8 62Q30 94 52 62z" fill="url(#gg)" stroke="#7A4E10" stroke-width=".8"/><rect x="26" y="80" width="8" height="26" fill="url(#gg)"/><ellipse cx="30" cy="92" rx="9" ry="3" fill="#E3B04B"/><path d="M12 116h36l-5-12H17z" fill="url(#gg)" stroke="#7A4E10" stroke-width=".8"/></svg>`;
      const rosette = () => {
        let s =
          '<svg viewBox="-23 -23 46 46" aria-hidden="true"><circle r="20" fill="#3A0912" stroke="#E3B04B" stroke-width="1.5"/>';
        for (let i = 0; i < 8; i++)
          s += `<path d="M0 -17Q5 -10 0 -4Q-5 -10 0 -17Z" transform="rotate(${i * 45})" fill="url(#gg)"/>`;
        return s + '<circle r="3.2" fill="#F6D68A"/></svg>';
      };
      function couple() {
        const o = (d, c) => `<path class="${c}" d="${d}"/>`,
          l = (d) => `<path class="gl_" d="${d}"/>`;
        return (
          '<svg class="cpl" viewBox="0 0 320 560" aria-hidden="true">' +
          /* groom: Kandyan cap, epaulettes, jacket, cloth */
          o(
            "M97 46Q97 28 110 24Q123 28 123 46ZM88 62Q88 44 110 44Q132 44 132 62ZM80 80Q80 62 110 62Q140 62 140 80Z",
            "b1",
          ) +
          l("M110 8v16M88 62H132M80 80H140M97 46H123") +
          `<circle class="gl_" cx="110" cy="7" r="3"/>` +
          o(
            "M110 96m-17 0a17 20 0 1 0 34 0a17 20 0 1 0-34 0M102 112h16v16h-16z",
            "b1",
          ) +
          o(
            "M48 146Q60 124 100 126L120 126Q160 124 172 146Q166 158 152 156L68 156Q54 158 48 146Z",
            "b1",
          ) +
          l(
            "M60 146q4-8 12-10M80 138q8-6 16-6M124 132q8 0 16 6M148 136q8 2 12 10",
          ) +
          o("M72 154L148 154L142 252L78 252Z", "b1") +
          l("M110 168v52M100 184h20M104 200h12") +
          `<circle class="gl_" cx="110" cy="178" r="8"/>` +
          o(
            "M70 156Q54 206 62 268L76 270Q82 210 84 160ZM148 156Q172 200 162 262L172 266Q186 205 156 156Z",
            "b1",
          ) +
          o("M74 246H146V258H74ZM76 258L144 258L168 556L52 556Z", "b1") +
          l("M92 258L84 556M110 258V556M128 258L136 556M100 258h20v140h-20z") +
          /* bride: bun, tiara, blouse, osariya */
          o(
            "M214 48m-15 0a15 15 0 1 0 30 0a15 15 0 1 0-30 0M214 86m-15 0a15 19 0 1 0 30 0a15 19 0 1 0-30 0M207 104h14v14h-14z",
            "b2",
          ) +
          l("M198 70Q214 54 230 70") +
          `<circle class="gl_" cx="200" cy="44" r="3"/><circle class="gl_" cx="228" cy="44" r="3"/><circle class="gl_" cx="214" cy="31" r="3"/>` +
          o("M178 136Q214 122 250 136L246 162L182 162Z", "b2") +
          l("M200 124Q214 146 228 124M194 130Q214 164 234 130") +
          o(
            "M186 160L242 160L236 238L192 238ZM246 138L196 236L210 244L254 162Z",
            "b2",
          ) +
          l("M236 150L204 238") +
          o(
            "M184 162Q164 210 166 262L176 268Q184 210 194 166ZM244 162Q262 210 258 268L248 268Q250 212 238 166Z",
            "b2",
          ) +
          `<circle class="b1" cx="168" cy="268" r="7"/>` +
          o("M190 238L238 238L282 556L150 556Z", "b2") +
          l(
            "M214 246L170 556M214 246L192 556M214 246V556M214 246L236 556M214 246L258 556M200 240Q214 262 228 240",
          ) +
          "</svg>"
        );
      }
      function moon() {
        const pe = (n, r0, r1, w) =>
          Array.from(
            { length: n },
            (_, i) =>
              `<path d="M0 ${-r1}Q${w} ${-(r0 + r1) / 2} 0 ${-r0}Q${-w} ${-(r0 + r1) / 2} 0 ${-r1}Z" transform="rotate(${(i * 360) / n})"/>`,
          ).join("");
        return `<svg viewBox="-110 -110 220 220" aria-hidden="true"><g class="r1"><circle r="105" fill="#4A0A18" stroke="url(#gg)" stroke-width="2.5"/><circle r="99" fill="none" stroke="#E3B04B" stroke-width="3" stroke-dasharray="1.2 5.4" stroke-linecap="round"/></g>
 <g class="r2" fill="url(#gg)" stroke="#7A4E10" stroke-width=".5">${pe(28, 78, 95, 6)}</g><circle r="74" fill="none" stroke="#E3B04B" stroke-width="1.2"/>
 <g class="r3" fill="#E3B04B">${Array.from({ length: 22 }, (_, i) => `<path d="M0 -71l4 6-4 6-4-6z" transform="rotate(${(i * 360) / 22})"/>`).join("")}</g><circle r="58" fill="none" stroke="#E3B04B" stroke-width="1.2"/>
 <g class="r2" fill="none" stroke="#F6D68A" stroke-width="1.2">${pe(16, 46, 60, 9)}</g><circle r="46" fill="#5A0D1D" stroke="#E3B04B" stroke-width="2"/></svg>`;
      }
      /* hills */
      $("#hills").innerHTML =
        '<path d="M0 140V70Q60 40 120 66T240 50T360 70T480 44V140z" fill="var(--h1)"/><path d="M0 140V95Q80 70 160 92T320 80T480 90V140z" fill="var(--h2)"/><path d="M0 140V118Q100 100 200 116T400 108T480 114V140z" fill="var(--h3)"/>';
      $("#ros").innerHTML = ["a", "b", "c", "d"]
        .map((c) => `<div class="ro ${c}">${rosette()}</div>`)
        .join("");
      const cpa = () =>
        '<div class="cpa"><i></i><img src="couple.png" alt=""></div>';
      ["#d1", "#d2"].forEach((i) => ($(i).innerHTML = cpa()));
      $("#cp").innerHTML = cpa();
      if (!W.sinhala) $("#si1").hidden = true;
      /* ===== pages ===== */
      const cal =
        "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" +
        encodeURIComponent(W.groom.name + " & " + W.bride.name + "'s Wedding") +
        "&dates=20261126T033000Z/20261126T093000Z&ctz=Asia/Colombo&location=" +
        encodeURIComponent(W.venue.name + ", " + W.venue.place);
      const mp =
          W.venue.mapsUrl ||
          `https://www.google.com/maps/search/?api=1&query=${mq}`,
        dr =
          W.venue.directionsUrl ||
          `https://www.google.com/maps/dir/?api=1&destination=${mq}`;
      const orn =
        '<svg class="orn" viewBox="0 0 120 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M0 7h46M74 7h46"/><path d="M60 1l6 6-6 6-6-6z" fill="currentColor"/><circle cx="48" cy="7" r="1.6" fill="currentColor"/><circle cx="72" cy="7" r="1.6" fill="currentColor"/></svg>';
      const P = [
        `<p class="lab a">Together with their families</p><div class="a" style="--d:.2s;width:min(34vw,14svh*1.25)">${lotus()}</div><h1 class="nm gt a" style="--d:.5s">${gf}</h1><p class="am a" style="--d:.8s">&amp;</p><h1 class="nm gt a" style="--d:1s">${bf}</h1><div class="a" style="--d:1.3s">${orn}</div>`,
        `<p class="big gt a">${gf} &amp; ${bf}</p><p class="txt a" style="--d:.4s">${esc(W.groom.name)}, son of ${W.groom.parents}, and ${esc(W.bride.name)}, daughter of ${W.bride.parents}, joyfully invite you to celebrate the beginning of their forever.</p>
<p class="lab a" style="--d:.8s">With the blessings of</p><div class="fm a" style="--d:1s"><div><b>${W.groom.family}</b><span>Family</span></div><i></i><div><b>${W.bride.family}</b><span>Family</span></div></div>`,
        `<p class="lab a">Save the date</p><div class="mn a" style="--d:.3s">${moon()}<div class="mc"><span class="d gt">26</span><span class="mo">NOVEMBER</span><span class="y">2026</span></div></div>
<div class="row a" style="--d:.9s"><span class="pill o">Thursday</span><span class="pill o">${W.timeShort}</span></div><p style="font:italic 600 1.3rem var(--cg);color:var(--ac);margin-top:.5rem" class="a">onwards</p>`,
        `<p class="big gt a">Location</p><div class="mf a" style="--d:.3s"><iframe title="Map to ${esc(W.venue.name)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${mq}&output=embed"></iframe></div>
<p class="vn a" style="--d:.7s"><b>${W.venue.name}</b><br>${W.venue.place}</p><div class="a" style="--d:.9s"><a class="pill" href="${dr}" target="_blank" rel="noopener"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 15C3 10 2 8 2 6a5 5 0 0110 0c0 2-1 4-5 9z"/><circle cx="7" cy="6" r="1.8"/></svg>Get directions</a></div><p class="a" style="--d:1.1s;margin-top:.5rem"><a href="${mp}" target="_blank" rel="noopener" style="color:var(--ac);font-size:.95rem">Open in Maps</a></p>`,
        `<p class="lab a">Until we celebrate</p><div class="a" style="--d:.2s">${orn}</div><div class="a" style="--d:.4s;margin-top:.8rem"><div class="cdn gt" id="cd0">00</div><span class="cdl">DAYS</span></div>
<div class="cdr a" id="cdr" style="--d:.8s"><div class="tile"><b>00</b><span>Hours</span></div><div class="tile"><b>00</b><span>Min</span></div><div class="tile"><b>00</b><span>Sec</span></div></div><p class="txt a" style="--d:1.3s;margin-top:1.4rem;font-style:italic">Two hearts, one beautiful beginning.</p>`,
        `${guest ? `<p class="lab a">Dear</p><p class="gn gt a" style="--d:.2s">${esc(guest)}</p>` : ""}<div class="a" style="--d:.5s">${orn}</div><p class="txt a" style="--d:.8s;font-size:1.45rem;font-style:italic;max-width:310px;margin-top:1rem">Your presence will make our special day even more meaningful.</p>
<p class="lab a" style="--d:1.1s;margin-bottom:1rem">26 November 2026 · ${W.venue.name}</p>
<div class="row a" style="--d:1.3s"><a class="pill" href="${cal}" target="_blank" rel="noopener">Add to calendar</a>${W.whatsapp ? `<a class="pill o" href="https://wa.me/${esc(W.whatsapp)}?text=${encodeURIComponent("Hi, this is " + (guest || "a guest") + ". I will be attending the wedding.")}" target="_blank" rel="noopener">Confirm attendance</a>` : ""}</div>`,
      ];
      const OP = [[1, ".95", "37svh"], [0], [0], [0], [0], [1, ".95", "35svh"]];
      $("#pgs").innerHTML = P.map(
        (h, i) =>
          `<section class="pg${OP[i][0] ? " top" : ""}" data-co="${OP[i][1] || ""}" data-ch="${OP[i][2] || ""}">${h}</section>`,
      ).join("");
      const pg = [...document.querySelectorAll(".pg")],
        last = pg.length - 1;
      let cur = -1,
        lock = 0,
        auto = 0,
        tm;
      /* ===== navigation ===== */
      function go(i, manual) {
        if (i < 0 || i > last || i === cur || lock) return;
        lock = 1;
        setTimeout(() => (lock = 0), 950);
        if (manual) stopAuto();
        const o = pg[cur];
        if (o) {
          o.classList.remove("on");
          o.classList.add("out");
          setTimeout(() => o.classList.remove("out"), 950);
        }
        const fl = $("#fl");
        fl.classList.remove("go");
        void fl.offsetWidth;
        fl.classList.add("go");
        cur = i;
        pg[i].classList.add("on");
        $("#cp").style.setProperty("--co", pg[i].dataset.co || ".10");
        $("#cp").style.setProperty("--ch", pg[i].dataset.ch || "50svh");
        $("#nxl").textContent = i === last ? "Start again" : "Scroll down";
        sched();
      }
      $("#nx").onclick = () => go(cur === last ? 0 : cur + 1, 1);
      addEventListener("keydown", (e) => {
        if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) {
          e.preventDefault();
          go(cur + 1, 1);
        }
        if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) {
          e.preventDefault();
          go(cur - 1, 1);
        }
      });
      let ty = null;
      addEventListener(
        "touchstart",
        (e) => {
          ty = e.touches[0].clientY;
        },
        { passive: true },
      );
      addEventListener(
        "touchend",
        (e) => {
          if (ty == null) return;
          const d = ty - e.changedTouches[0].clientY;
          ty = null;
          if (Math.abs(d) > 45) go(cur + (d > 0 ? 1 : -1), 1);
        },
        { passive: true },
      );
      addEventListener(
        "wheel",
        (e) => {
          if (Math.abs(e.deltaY) > 25) go(cur + (e.deltaY > 0 ? 1 : -1), 1);
        },
        { passive: true },
      );
      const ab = $("#auto");
      function sched() {
        clearTimeout(tm);
        if (!auto) return;
        tm = setTimeout(
          () => {
            if (cur < last) go(cur + 1);
            else stopAuto();
          },
          (cur === 0 ? W.pageSeconds + 1 : W.pageSeconds) * 1000,
        );
      }
      function startAuto() {
        auto = 1;
        ab.setAttribute("aria-pressed", true);
        sched();
      }
      function stopAuto() {
        auto = 0;
        clearTimeout(tm);
        ab.setAttribute("aria-pressed", false);
      }
      ab.onclick = () => (auto ? stopAuto() : startAuto());
      if (RM) ab.hidden = true;
      /* ===== music ===== */
      let au,
        on = 0;
      const mus = $("#mus");
      function setM(v) {
        on = v;
        mus.setAttribute("aria-pressed", !!v);
        mus.setAttribute("aria-label", v ? "Mute music" : "Play music");
      }
      function startM() {
        if (!W.musicUrl) return;
        au =
          au ||
          Object.assign(new Audio(W.musicUrl), {
            loop: true,
            volume: W.musicVolume,
          });
        au.play()
          .then(() => setM(1))
          .catch(() => setM(0));
      }
      if (W.musicUrl)
        fetch(W.musicUrl, { method: "HEAD" })
          .then((r) => {
            if (r.ok) {
              mus.hidden = false;
              mus.onclick = () => {
                if (on) {
                  au && au.pause();
                  setM(0);
                } else startM();
              };
            }
          })
          .catch(() => {});
      /* ===== cover ===== */
      $("#to").textContent = guest ? "For " + guest : "";
      let opened = 0;
      function openIt() {
        if (opened) return;
        opened = 1;
        startM();
        burst(80);
        $("#cover").classList.add("open");
        setTimeout(
          () => {
            go(0);
            if (!RM) startAuto();
          },
          RM ? 100 : 1100,
        );
      }
      $("#cover").onclick = openIt;
      /* ===== jasmine petals + gold sparkles ===== */
      const cv = $("#bg"),
        cx = cv.getContext("2d"),
        PC =
          W.theme === "dark"
            ? ["#FFF6E2", "#FFE9B0", "#F6D68A", "#FFFFFF"]
            : ["#C9486A", "#E3B04B", "#E98A15", "#A8243D"],
        SC = W.theme === "dark" ? "#FFE9A8" : "#B8862E";
      let CW,
        CH,
        D,
        PT = [],
        SP = [];
      const mk = (b) => ({
        x: b ? CW / 2 + (Math.random() - 0.5) * 50 : Math.random() * CW,
        y: b ? CH * 0.48 : Math.random() * CH,
        z: 0.5 + Math.random() * 0.8,
        r: Math.random() * 6.3,
        vr: (Math.random() - 0.5) * 0.04,
        sw: Math.random() * 6.3,
        c: PC[(Math.random() * 4) | 0],
        vx: b ? (Math.random() - 0.5) * 15 : 0,
        vy: b ? -Math.random() * 13 - 3 : 0,
        b,
      });
      function burst(n) {
        for (let i = 0; i < n; i++) PT.push(mk(1));
      }
      function rs() {
        D = Math.min(devicePixelRatio || 1, 1.5);
        const r = $("#app").getBoundingClientRect();
        CW = cv.width = r.width * D;
        CH = cv.height = r.height * D;
        PT = Array.from({ length: 18 }, () => mk());
        SP = Array.from({ length: 34 }, () => ({
          x: Math.random() * CW,
          y: Math.random() * CH,
          s: 0.5 + Math.random() * 1.4,
          p: Math.random() * 6.3,
          v: 0.1 + Math.random() * 0.3,
        }));
      }
      function draw(t) {
        t *= 0.001;
        cx.clearRect(0, 0, CW, CH);
        SP.forEach((s) => {
          s.y -= s.v * D;
          if (s.y < -6) s.y = CH + 6;
          const a = 0.25 + 0.75 * Math.abs(Math.sin(t * 1.3 + s.p)),
            r = s.s * 2.6 * D;
          cx.globalAlpha = a;
          cx.fillStyle = SC;
          cx.fillRect(s.x - r, s.y - 0.6 * D, r * 2, 1.2 * D);
          cx.fillRect(s.x - 0.6 * D, s.y - r, 1.2 * D, r * 2);
        });
        for (let i = PT.length - 1; i >= 0; i--) {
          const p = PT[i];
          if (p.b) {
            p.vy += 0.28;
            p.vx *= 0.985;
            p.x += p.vx * D;
            p.y += p.vy * D;
            if (p.y > CH + 40) {
              PT.splice(i, 1);
              continue;
            }
          } else {
            p.y += (0.6 + p.z * 0.8) * D;
            p.x += (Math.sin(t * 0.8 + p.sw) * 0.6 + 0.2) * D;
            if (p.y > CH + 30) {
              p.y = -30;
              p.x = Math.random() * CW;
            }
            if (p.x > CW + 30) p.x = -30;
          }
          p.r += p.vr;
          cx.save();
          cx.translate(p.x, p.y);
          cx.rotate(p.r);
          const s = p.z * D * 0.9;
          cx.scale(s, s * (0.5 + 0.5 * Math.cos(t * 1.4 + p.sw)));
          cx.globalAlpha = 0.8;
          cx.fillStyle = p.c;
          cx.beginPath();
          cx.moveTo(0, -11);
          cx.bezierCurveTo(9, -9, 10, 6, 0, 13);
          cx.bezierCurveTo(-10, 6, -9, -9, 0, -11);
          cx.fill();
          cx.restore();
        }
        cx.globalAlpha = 1;
        if (!RM) requestAnimationFrame(draw);
      }
      rs();
      addEventListener("resize", rs);
      requestAnimationFrame(draw);
      /* ===== countdown ===== */
      function tick() {
        const d = dt - Date.now(),
          v =
            d <= 0
              ? [0, 0, 0, 0]
              : [
                  Math.floor(d / 864e5),
                  Math.floor(d / 36e5) % 24,
                  Math.floor(d / 6e4) % 60,
                  Math.floor(d / 1e3) % 60,
                ],
          p = (n) => String(n).padStart(2, "0");
        $("#cd0").textContent = p(v[0]);
        document
          .querySelectorAll("#cdr b")
          .forEach((b, i) => (b.textContent = p(v[i + 1])));
        if (d > 0) setTimeout(tick, 1000);
      }
      tick();
    </script>
  </body>
</html>
